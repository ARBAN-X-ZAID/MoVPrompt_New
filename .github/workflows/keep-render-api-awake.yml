name: Keep Render API awake

on:
  schedule:
    # UTC. GitHub's shortest schedule is 5 minutes, so this is one health
    # check at that interval. Render sleeps a free service after 15 minutes.
    - cron: "1,6,11,16,21,26,31,36,41,46,51,56 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: Ping API health
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Request health
        run: curl --fail --silent --show-error --retry 2 --retry-delay 20 --retry-all-errors --max-time 90 "https://movprompt-new.onrender.com/api/v1/health"
