name: Keep Render API awake

on:
  schedule:
    # Free Render web services sleep after 15 minutes without a request.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: Ping API health
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Request health
        run: curl --fail --silent --show-error --retry 2 --retry-delay 20 --retry-all-errors --max-time 90 "https://movprompt-new.onrender.com/api/v1/health"
