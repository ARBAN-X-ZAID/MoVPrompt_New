name: Keep Render API awake

on:
  schedule:
    # UTC. One health check every 10 minutes, offset from the hour so it is
    # less likely to be dropped when GitHub's scheduler is busy.
    - cron: "2,12,22,32,42,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: Ping API health
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Request health
        run: curl --fail --silent --show-error --retry 2 --retry-delay 20 --retry-all-errors --max-time 90 "https://movprompt-new.onrender.com/api/v1/health"
