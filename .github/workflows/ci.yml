name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.12
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  application-quality:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck all workspaces
        run: bun run typecheck

      - name: Build shared runtime imports before tests
        run: bun run build:packages

      - name: Test all workspaces
        run: |
          # Node creates this as a SQLite-backed localStorage database. Writing
          # JSON into it first makes every browser-storage test fail with
          # ERR_INVALID_STATE: file is not a database.
          rm -f /tmp/movprompt-vitest-localstorage /tmp/movprompt-vitest-localstorage.json
          bun run test:all

      - name: Build all workspaces
        run: bun run build:all

      - name: Enforce initial web JavaScript budget
        run: bun run check:web-bundle

  migration-and-infrastructure:
    name: Infrastructure and container checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Validate Compose configuration
        run: docker compose --env-file infra/environments/local.example --profile application config --quiet

      - name: Validate infrastructure shell scripts
        run: bash -n scripts/infra/*.sh

      - name: Build local API and worker images
        run: docker compose --env-file infra/environments/local.example --profile application build api worker

  mongo-admin-integration:
    name: Transactional MongoDB and admin integration
    # MongoDB 8 refuses affected 6.19+ kernels (SERVER-121912). Use the
    # supported Ubuntu 22.04 kernel instead of disabling its startup guard.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      ADMIN_TEST_MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true
      MOVPROMPT_TEST_MONGO: "true"
      MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true
      ADMIN_REAL_STORAGE_TEST: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Start isolated MongoDB replica set
        run: |
          docker run --detach --name mongo-admin --publish 27017:27017 mongo:8 --replSet rs0 --bind_ip_all --wiredTigerCacheSizeGB 0.25
          for attempt in $(seq 1 30); do
            if [ "$(docker inspect --format '{{.State.Running}}' mongo-admin)" != "true" ]; then
              docker logs mongo-admin
              exit 1
            fi
            if docker exec mongo-admin mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec mongo-admin mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for attempt in $(seq 1 30); do
            if docker exec mongo-admin mongosh --quiet --eval 'if (!db.hello().isWritablePrimary) quit(1)' >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Build shared packages
        run: bun run build:packages
      - name: Verify catalog, owner security, wallet and worker snapshots
        run: |
          bun run --cwd packages/db test --run --testTimeout=30000 --hookTimeout=30000
          bun run --cwd apps/api test --run src/admin/admin.integration.test.ts src/admin/business-renders.integration.test.ts src/admin/system.integration.test.ts --testTimeout=30000 --hookTimeout=30000
          bun run --cwd apps/worker test --run src/managed-template.integration.test.ts --testTimeout=30000 --hookTimeout=30000
      - name: Stop disposable database
        if: always()
        run: |
          docker logs mongo-admin
          docker rm --force mongo-admin
