services:
  - type: web
    runtime: static
    name: movprompt-web-zaid
    autoDeployTrigger: off
    buildCommand: bun install --frozen-lockfile && bun run build:web
    staticPublishPath: ./apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_API_ORIGIN
        value: https://movprompt-api-zaid.onrender.com
      - key: VITE_FEATURE_PORTABLE_AUTH
        value: "true"
      - key: VITE_AUTH_REQUIRE_EMAIL_VERIFICATION
        value: "false"
      - key: VITE_AUTH_GOOGLE_ENABLED
        value: "false"
      - key: VITE_AUTH_APPLE_ENABLED
        value: "false"
      - key: VITE_FEATURE_GUEST_CREATOR
        value: "true"
      - key: VITE_FEATURE_WORKSPACE_SHELL
        value: "true"
      - key: VITE_FEATURE_PROJECTS
        value: "true"
      - key: VITE_FEATURE_ADVANCED_MODE
        value: "true"
      - key: VITE_FEATURE_EXPORT_PIPELINE
        value: "false"
      - key: VITE_FEATURE_LOCAL_DEMO_GENERATION
        value: "false"
      - key: VITE_FEATURE_DEVELOPMENT_FREE_GENERATION
        value: "false"

  - type: web
    runtime: docker
    name: movprompt-api-zaid
    region: frankfurt
    plan: free
    autoDeployTrigger: off
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    healthCheckPath: /api/v1/health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: PUBLIC_APP_URL
        value: https://movprompt-web-zaid.onrender.com
      - key: WEB_ORIGIN
        value: https://movprompt-web-zaid.onrender.com
      - key: API_ORIGIN
        value: https://movprompt-api-zaid.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://movprompt-web-zaid.onrender.com
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: FEATURE_AUTHENTICATION
        value: "true"
      - key: FEATURE_ASSETS
        value: "true"
      - key: FEATURE_TEMPLATE_MODE
        value: "true"
      - key: FEATURE_ADVANCED_MODE
        value: "true"
      - key: FEATURE_GENERATION
        value: "false"
      - key: FEATURE_EXPORTS
        value: "false"
      - key: FEATURE_BILLING
        value: "false"
      - key: DEVELOPMENT_FREE_GENERATION
        value: "false"
      - key: GENERATION_STARTER_ONLY
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: movprompt
      - key: MONGODB_POOL_MAX
        value: "30"
      - key: BETTER_AUTH_URL
        value: https://movprompt-api-zaid.onrender.com
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_TRUSTED_ORIGINS
        value: https://movprompt-web-zaid.onrender.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_ASSETS_BUCKET
        value: movprompt
      - key: R2_OUTPUTS_BUCKET
        value: movprompt
      - key: R2_TEMPLATE_PREVIEWS_BUCKET
        value: movprompt
      - key: R2_TEMPLATE_PREVIEWS_BASE_URL
        value: ""
      - key: R2_UPLOAD_URL_TTL_SECONDS
        value: "900"
      - key: R2_DOWNLOAD_URL_TTL_SECONDS
        value: "900"
      - key: GUEST_TRUST_PROXY
        value: "true"
