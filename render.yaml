services:
  - type: web
    runtime: static
    name: movprompt-web-zaid
    autoDeployTrigger: off
    buildCommand: bun install --frozen-lockfile && bun run build:web
    staticPublishPath: ./apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_API_ORIGIN
        value: https://movprompt-api-zaid.onrender.com
      - key: VITE_FEATURE_PORTABLE_AUTH
        value: "true"
      - key: VITE_AUTH_REQUIRE_EMAIL_VERIFICATION
        value: "false"
      - key: VITE_AUTH_GOOGLE_ENABLED
        value: "false"
      - key: VITE_AUTH_APPLE_ENABLED
        value: "false"
      - key: VITE_FEATURE_GUEST_CREATOR
        value: "true"
      - key: VITE_FEATURE_WORKSPACE_SHELL
        value: "true"
      - key: VITE_FEATURE_PROJECTS
        value: "true"
      - key: VITE_FEATURE_ADVANCED_MODE
        value: "true"
      - key: VITE_FEATURE_EXPORT_PIPELINE
        value: "false"
      - key: VITE_FEATURE_LOCAL_DEMO_GENERATION
        value: "false"
      - key: VITE_FEATURE_DEVELOPMENT_FREE_GENERATION
        value: "false"

  - type: web
    runtime: docker
    name: movprompt-api-zaid
    region: frankfurt
    plan: free
    autoDeployTrigger: off
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    healthCheckPath: /api/v1/health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: PUBLIC_APP_URL
        value: https://movprompt-web-zaid.onrender.com
      - key: WEB_ORIGIN
        value: https://movprompt-web-zaid.onrender.com
      - key: API_ORIGIN
        value: https://movprompt-api-zaid.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://movprompt-web-zaid.onrender.com
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: FEATURE_AUTHENTICATION
        value: "true"
      - key: FEATURE_ASSETS
        value: "true"
      - key: FEATURE_TEMPLATE_MODE
        value: "true"
      - key: FEATURE_ADVANCED_MODE
        value: "true"
      - key: FEATURE_GENERATION
        value: "false"
      - key: FEATURE_EXPORTS
        value: "false"
      - key: FEATURE_BILLING
        value: "false"
      - key: DEVELOPMENT_FREE_GENERATION
        value: "false"
      - key: GENERATION_STARTER_ONLY
        value: "true"
      - key: GENERATION_FREE_ACCOUNTS
        value: "false"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: movprompt
      - key: MONGODB_POOL_MAX
        value: "30"
      - key: BETTER_AUTH_URL
        value: https://movprompt-api-zaid.onrender.com
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_TRUSTED_ORIGINS
        value: https://movprompt-web-zaid.onrender.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_ASSETS_BUCKET
        value: movprompt
      - key: R2_OUTPUTS_BUCKET
        value: movprompt
      - key: R2_TEMPLATE_PREVIEWS_BUCKET
        value: movprompt
      - key: R2_TEMPLATE_PREVIEWS_BASE_URL
        value: ""
      - key: R2_UPLOAD_URL_TTL_SECONDS
        value: "900"
      - key: R2_DOWNLOAD_URL_TTL_SECONDS
        value: "900"
      - key: GUEST_TRUST_PROXY
        value: "true"
      - key: GUEST_DAILY_BUDGET_USD
        sync: false
      - key: GUEST_MAX_RENDER_COST_USD
        sync: false
      - key: AI_GATEWAY_API_KEY
        sync: false
      - key: VERCEL_AI_GATEWAY_BASE_URL
        value: https://ai-gateway.vercel.sh/v4/ai
      - key: MOVPROMPT_PROVIDER_VERCEL_GATEWAY_READY
        value: "true"
      - key: MOVPROMPT_CAPABILITY_VIDEO_CINEMATIC_ENABLED
        value: "true"
      - key: MOVPROMPT_CAPABILITY_VIDEO_CINEMATIC_ADAPTER_ID
        value: vercel-ai-gateway
      - key: MOVPROMPT_CAPABILITY_VIDEO_CINEMATIC_MODEL_ID
        value: bytedance/seedance-2.5
      - key: MOVPROMPT_CAPABILITY_VIDEO_PRODUCT_FIDELITY_ENABLED
        value: "true"
      - key: MOVPROMPT_CAPABILITY_VIDEO_PRODUCT_FIDELITY_ADAPTER_ID
        value: vercel-ai-gateway
      - key: MOVPROMPT_CAPABILITY_VIDEO_PRODUCT_FIDELITY_MODEL_ID
        value: bytedance/seedance-2.5
      - key: GENERATION_PRICING_VERSION
        value: seedance-25-canary-2026-08-15
      - key: GENERATION_QUOTE_TTL_SECONDS
        value: "900"
      - key: GENERATION_VIDEO_CINEMATIC_480P_CREDITS_PER_SECOND
        value: "10"
      - key: GENERATION_VIDEO_CINEMATIC_720P_CREDITS_PER_SECOND
        value: "20"
      - key: GENERATION_VIDEO_PRODUCT_FIDELITY_480P_CREDITS_PER_SECOND
        value: "10"
      - key: GENERATION_VIDEO_PRODUCT_FIDELITY_720P_CREDITS_PER_SECOND
        value: "20"
      - key: PROVIDER_OUTPUT_ALLOWED_HOSTS
        value: ark-acg-ap-southeast-1.tos-ap-southeast-1.volces.com
      - key: VERCEL_GATEWAY_SEEDANCE_RESOLUTION_TIER
        value: 720p
      - key: VERCEL_GATEWAY_SEEDANCE_GENERATE_AUDIO
        value: "false"
      - key: FFMPEG_PATH
        value: ffmpeg
      - key: FFPROBE_PATH
        value: ffprobe
      - key: MOVPROMPT_QUALITY_MODEL_ID
        value: google/gemini-3.6-flash
      - key: WORKER_HEARTBEAT_INTERVAL_SECONDS
        value: "15"
      - key: WORKER_HEARTBEAT_MAX_AGE_SECONDS
        value: "45"

  - type: worker
    runtime: docker
    name: movprompt-worker-zaid
    region: frankfurt
    plan: starter
    autoDeployTrigger: off
    dockerfilePath: ./Dockerfile.worker
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: FEATURE_GENERATION
        value: "false"
      - key: DEVELOPMENT_FREE_GENERATION
        value: "false"
      - key: MONGODB_URI
        fromService:
          name: movprompt-api-zaid
          type: web
          envVarKey: MONGODB_URI
      - key: MONGODB_DATABASE
        value: movprompt
      - key: WORKER_ID
        value: movprompt-production-worker
      - key: WORKER_SMOKE_TEST_ON_START
        value: "false"
      - key: WORKER_OUTBOX_BATCH_SIZE
        value: "20"
      - key: WORKER_OUTBOX_LEASE_MS
        value: "60000"
      - key: WORKER_OUTBOX_POLL_INTERVAL_MS
        value: "1000"
      - key: WORKER_RENDER_RECONCILIATION_DELAY_SECONDS
        value: "15"
      - key: WORKER_HEARTBEAT_INTERVAL_SECONDS
        value: "15"
      - key: R2_ACCOUNT_ID
        fromService:
          name: movprompt-api-zaid
          type: web
          envVarKey: R2_ACCOUNT_ID
      - key: R2_ACCESS_KEY_ID
        fromService:
          name: movprompt-api-zaid
          type: web
          envVarKey: R2_ACCESS_KEY_ID
      - key: R2_SECRET_ACCESS_KEY
        fromService:
          name: movprompt-api-zaid
          type: web
          envVarKey: R2_SECRET_ACCESS_KEY
      - key: R2_ASSETS_BUCKET
        value: movprompt
      - key: R2_OUTPUTS_BUCKET
        value: movprompt
      - key: R2_TEMPLATE_PREVIEWS_BUCKET
        value: movprompt
      - key: R2_TEMPLATE_PREVIEWS_BASE_URL
        value: ""
      - key: AI_GATEWAY_API_KEY
        fromService:
          name: movprompt-api-zaid
          type: web
          envVarKey: AI_GATEWAY_API_KEY
      - key: VERCEL_AI_GATEWAY_BASE_URL
        value: https://ai-gateway.vercel.sh/v4/ai
      - key: MOVPROMPT_PROVIDER_VERCEL_GATEWAY_READY
        value: "true"
      - key: MOVPROMPT_CAPABILITY_VIDEO_CINEMATIC_ENABLED
        value: "true"
      - key: MOVPROMPT_CAPABILITY_VIDEO_CINEMATIC_ADAPTER_ID
        value: vercel-ai-gateway
      - key: MOVPROMPT_CAPABILITY_VIDEO_CINEMATIC_MODEL_ID
        value: bytedance/seedance-2.5
      - key: MOVPROMPT_CAPABILITY_VIDEO_PRODUCT_FIDELITY_ENABLED
        value: "true"
      - key: MOVPROMPT_CAPABILITY_VIDEO_PRODUCT_FIDELITY_ADAPTER_ID
        value: vercel-ai-gateway
      - key: MOVPROMPT_CAPABILITY_VIDEO_PRODUCT_FIDELITY_MODEL_ID
        value: bytedance/seedance-2.5
      - key: GENERATION_PRICING_VERSION
        value: seedance-25-canary-2026-08-15
      - key: GENERATION_QUOTE_TTL_SECONDS
        value: "900"
      - key: GENERATION_VIDEO_CINEMATIC_480P_CREDITS_PER_SECOND
        value: "10"
      - key: GENERATION_VIDEO_CINEMATIC_720P_CREDITS_PER_SECOND
        value: "20"
      - key: GENERATION_VIDEO_PRODUCT_FIDELITY_480P_CREDITS_PER_SECOND
        value: "10"
      - key: GENERATION_VIDEO_PRODUCT_FIDELITY_720P_CREDITS_PER_SECOND
        value: "20"
      - key: PROVIDER_OUTPUT_ALLOWED_HOSTS
        value: ark-acg-ap-southeast-1.tos-ap-southeast-1.volces.com
      - key: VERCEL_GATEWAY_SEEDANCE_RESOLUTION_TIER
        value: 720p
      - key: VERCEL_GATEWAY_SEEDANCE_GENERATE_AUDIO
        value: "false"
      - key: FFMPEG_PATH
        value: ffmpeg
      - key: FFPROBE_PATH
        value: ffprobe
      - key: MOVPROMPT_QUALITY_MODEL_ID
        value: google/gemini-3.6-flash
      - key: GENERATION_STARTER_ONLY
        value: "true"
      - key: GENERATION_FREE_ACCOUNTS
        value: "false"
