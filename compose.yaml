name: ${COMPOSE_PROJECT_NAME:-movprompt-local}

x-api-image: &api-image
  image: ${COMPOSE_PROJECT_NAME:-movprompt-local}-api:local
  build:
    context: .
    dockerfile: Dockerfile.api

services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - backend

  mailpit:
    image: axllent/mailpit:v1.30.5
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "${MAILPIT_MAX_MESSAGES:-500}"
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - backend

  mongodb-init:
    image: mongo:8.0
    profiles: ["application"]
    restart: "no"
    entrypoint:
      - /bin/bash
      - -ec
      - |
        mongosh --host mongodb:27017 --quiet --eval '
          try { rs.status() }
          catch (error) { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongodb:27017"}]}) }
          while (!db.hello().isWritablePrimary) { sleep(500) }
        '
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - backend

  api:
    <<: *api-image
    profiles: ["application"]
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NODE_ENV: production
      APP_ENV: "${APP_ENV:-local}"
      APP_VERSION: "${APP_VERSION:-0.1.0-local}"
      COMMIT_SHA: "${COMMIT_SHA:-local}"
      API_PORT: "3000"
      PUBLIC_APP_URL: "${PUBLIC_APP_URL:-http://localhost:8080}"
      WEB_ORIGIN: "${WEB_ORIGIN:-http://localhost:8080}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}"
      FEATURE_AUTHENTICATION: "${FEATURE_AUTHENTICATION:-true}"
      FEATURE_ASSETS: "${FEATURE_ASSETS:-true}"
      FEATURE_TEMPLATE_MODE: "${FEATURE_TEMPLATE_MODE:-true}"
      FEATURE_ADVANCED_MODE: "${FEATURE_ADVANCED_MODE:-true}"
      FEATURE_GENERATION: "${FEATURE_GENERATION:-false}"
      DEVELOPMENT_FREE_GENERATION: "${DEVELOPMENT_FREE_GENERATION:-false}"
      GENERATION_PRICING_VERSION: "${GENERATION_PRICING_VERSION:-}"
      GENERATION_QUOTE_TTL_SECONDS: "${GENERATION_QUOTE_TTL_SECONDS:-}"
      GENERATION_STARTER_ONLY: "${GENERATION_STARTER_ONLY:-true}"
      GENERATION_FREE_ACCOUNTS: "${GENERATION_FREE_ACCOUNTS:-false}"
      GENERATION_VIDEO_CINEMATIC_CREDITS_PER_SECOND: "${GENERATION_VIDEO_CINEMATIC_CREDITS_PER_SECOND:-}"
      GENERATION_VIDEO_PRODUCT_FIDELITY_CREDITS_PER_SECOND: "${GENERATION_VIDEO_PRODUCT_FIDELITY_CREDITS_PER_SECOND:-}"
      GENERATION_VIDEO_CINEMATIC_480P_CREDITS_PER_SECOND: "${GENERATION_VIDEO_CINEMATIC_480P_CREDITS_PER_SECOND:-}"
      GENERATION_VIDEO_CINEMATIC_720P_CREDITS_PER_SECOND: "${GENERATION_VIDEO_CINEMATIC_720P_CREDITS_PER_SECOND:-}"
      GENERATION_VIDEO_PRODUCT_FIDELITY_480P_CREDITS_PER_SECOND: "${GENERATION_VIDEO_PRODUCT_FIDELITY_480P_CREDITS_PER_SECOND:-}"
      GENERATION_VIDEO_PRODUCT_FIDELITY_720P_CREDITS_PER_SECOND: "${GENERATION_VIDEO_PRODUCT_FIDELITY_720P_CREDITS_PER_SECOND:-}"
      GENERATION_IMAGE_PRODUCT_CREDITS_PER_IMAGE: "${GENERATION_IMAGE_PRODUCT_CREDITS_PER_IMAGE:-}"
      FEATURE_EXPORTS: "${FEATURE_EXPORTS:-false}"
      FEATURE_BILLING: "${FEATURE_BILLING:-false}"
      MONGODB_URI: "mongodb://mongodb:27017/${MONGODB_DATABASE:-movprompt}?replicaSet=rs0&directConnection=true"
      MONGODB_DATABASE: "${MONGODB_DATABASE:-movprompt}"
      BETTER_AUTH_URL: "${BETTER_AUTH_URL:-http://localhost:8787}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:-movprompt-local-only-better-auth-secret-change-me}"
      GUEST_TRUST_PROXY: "${GUEST_TRUST_PROXY:-false}"
      GUEST_DAILY_BUDGET_USD: "${GUEST_DAILY_BUDGET_USD:-}"
      GUEST_MAX_RENDER_COST_USD: "${GUEST_MAX_RENDER_COST_USD:-}"
      BETTER_AUTH_TRUSTED_ORIGINS: "${BETTER_AUTH_TRUSTED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      APPLE_CLIENT_ID: "${APPLE_CLIENT_ID:-}"
      APPLE_CLIENT_SECRET: "${APPLE_CLIENT_SECRET:-}"
      APPLE_APP_BUNDLE_IDENTIFIER: "${APPLE_APP_BUNDLE_IDENTIFIER:-}"
      EMAIL_FROM: "${EMAIL_FROM:-MovPrompt <no-reply@localhost>}"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      R2_ACCOUNT_ID: "${R2_ACCOUNT_ID:-}"
      R2_ACCESS_KEY_ID: "${R2_ACCESS_KEY_ID:-}"
      R2_SECRET_ACCESS_KEY: "${R2_SECRET_ACCESS_KEY:-}"
      R2_ASSETS_BUCKET: "${R2_ASSETS_BUCKET:-}"
      R2_OUTPUTS_BUCKET: "${R2_OUTPUTS_BUCKET:-}"
      R2_TEMPLATE_PREVIEWS_BUCKET: "${R2_TEMPLATE_PREVIEWS_BUCKET:-}"
      R2_TEMPLATE_PREVIEWS_BASE_URL: "${R2_TEMPLATE_PREVIEWS_BASE_URL:-}"
      PROVIDER_OUTPUT_ALLOWED_HOSTS: "${PROVIDER_OUTPUT_ALLOWED_HOSTS:-}"
      AI_GATEWAY_API_KEY: "${AI_GATEWAY_API_KEY:-}"
      VERCEL_AI_GATEWAY_BASE_URL: "${VERCEL_AI_GATEWAY_BASE_URL:-https://ai-gateway.vercel.sh/v4/ai}"
      VERCEL_GATEWAY_SEEDANCE_RESOLUTION_TIER: "${VERCEL_GATEWAY_SEEDANCE_RESOLUTION_TIER:-720p}"
      MOVPROMPT_QUALITY_MODEL_ID: "${MOVPROMPT_QUALITY_MODEL_ID:-google/gemini-3.6-flash}"
      VERCEL_GATEWAY_SEEDANCE_GENERATE_AUDIO: "${VERCEL_GATEWAY_SEEDANCE_GENERATE_AUDIO:-false}"
      WORKER_HEARTBEAT_MAX_AGE_SECONDS: "${WORKER_HEARTBEAT_MAX_AGE_SECONDS:-45}"
      FFMPEG_PATH: "${FFMPEG_PATH:-ffmpeg}"
      FFPROBE_PATH: "${FFPROBE_PATH:-ffprobe}"
      MOVPROMPT_CAPABILITY_VIDEO_CINEMATIC_ENABLED: "${MOVPROMPT_CAPABILITY_VIDEO_CINEMATIC_ENABLED:-false}"
      MOVPROMPT_CAPABILITY_VIDEO_CINEMATIC_ADAPTER_ID: "${MOVPROMPT_CAPABILITY_VIDEO_CINEMATIC_ADAPTER_ID:-}"
      MOVPROMPT_CAPABILITY_VIDEO_CINEMATIC_MODEL_ID: "${MOVPROMPT_CAPABILITY_VIDEO_CINEMATIC_MODEL_ID:-}"
      MOVPROMPT_CAPABILITY_VIDEO_PRODUCT_FIDELITY_ENABLED: "${MOVPROMPT_CAPABILITY_VIDEO_PRODUCT_FIDELITY_ENABLED:-false}"
      MOVPROMPT_CAPABILITY_VIDEO_PRODUCT_FIDELITY_ADAPTER_ID: "${MOVPROMPT_CAPABILITY_VIDEO_PRODUCT_FIDELITY_ADAPTER_ID:-}"
      MOVPROMPT_CAPABILITY_VIDEO_PRODUCT_FIDELITY_MODEL_ID: "${MOVPROMPT_CAPABILITY_VIDEO_PRODUCT_FIDELITY_MODEL_ID:-}"
      MOVPROMPT_CAPABILITY_IMAGE_PRODUCT_ENABLED: "${MOVPROMPT_CAPABILITY_IMAGE_PRODUCT_ENABLED:-false}"
      MOVPROMPT_CAPABILITY_IMAGE_PRODUCT_ADAPTER_ID: "${MOVPROMPT_CAPABILITY_IMAGE_PRODUCT_ADAPTER_ID:-}"
      MOVPROMPT_CAPABILITY_IMAGE_PRODUCT_MODEL_ID: "${MOVPROMPT_CAPABILITY_IMAGE_PRODUCT_MODEL_ID:-}"
      MOVPROMPT_PROVIDER_VERCEL_GATEWAY_READY: "${MOVPROMPT_PROVIDER_VERCEL_GATEWAY_READY:-false}"
    ports:
      - "127.0.0.1:${API_PORT:-8787}:3000"
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 15s
    networks:
      - backend

  worker:
    profiles: ["application"]
    image: ${COMPOSE_PROJECT_NAME:-movprompt-local}-worker:local
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NODE_ENV: production
      APP_ENV: "${APP_ENV:-local}"
      APP_VERSION: "${APP_VERSION:-0.1.0-local}"
      FEATURE_GENERATION: "${FEATURE_GENERATION:-false}"
      DEVELOPMENT_FREE_GENERATION: "${DEVELOPMENT_FREE_GENERATION:-false}"
      GENERATION_PRICING_VERSION: "${GENERATION_PRICING_VERSION:-}"
      GENERATION_QUOTE_TTL_SECONDS: "${GENERATION_QUOTE_TTL_SECONDS:-}"
      GENERATION_VIDEO_CINEMATIC_480P_CREDITS_PER_SECOND: "${GENERATION_VIDEO_CINEMATIC_480P_CREDITS_PER_SECOND:-}"
      GENERATION_VIDEO_CINEMATIC_720P_CREDITS_PER_SECOND: "${GENERATION_VIDEO_CINEMATIC_720P_CREDITS_PER_SECOND:-}"
      GENERATION_VIDEO_PRODUCT_FIDELITY_480P_CREDITS_PER_SECOND: "${GENERATION_VIDEO_PRODUCT_FIDELITY_480P_CREDITS_PER_SECOND:-}"
      GENERATION_VIDEO_PRODUCT_FIDELITY_720P_CREDITS_PER_SECOND: "${GENERATION_VIDEO_PRODUCT_FIDELITY_720P_CREDITS_PER_SECOND:-}"
      MONGODB_URI: "mongodb://mongodb:27017/${MONGODB_DATABASE:-movprompt}?replicaSet=rs0&directConnection=true"
      MONGODB_DATABASE: "${MONGODB_DATABASE:-movprompt}"
      WORKER_ID: "${WORKER_ID:-movprompt-local-worker}"
      WORKER_SMOKE_TEST_ON_START: "${WORKER_SMOKE_TEST_ON_START:-true}"
      WORKER_OUTBOX_BATCH_SIZE: "${WORKER_OUTBOX_BATCH_SIZE:-20}"
      WORKER_OUTBOX_LEASE_MS: "${WORKER_OUTBOX_LEASE_MS:-60000}"
      WORKER_OUTBOX_POLL_INTERVAL_MS: "${WORKER_OUTBOX_POLL_INTERVAL_MS:-1000}"
      WORKER_RENDER_RECONCILIATION_DELAY_SECONDS: "${WORKER_RENDER_RECONCILIATION_DELAY_SECONDS:-15}"
      WORKER_HEARTBEAT_INTERVAL_SECONDS: "${WORKER_HEARTBEAT_INTERVAL_SECONDS:-15}"
      R2_ACCOUNT_ID: "${R2_ACCOUNT_ID:-}"
      R2_ACCESS_KEY_ID: "${R2_ACCESS_KEY_ID:-}"
      R2_SECRET_ACCESS_KEY: "${R2_SECRET_ACCESS_KEY:-}"
      R2_ASSETS_BUCKET: "${R2_ASSETS_BUCKET:-}"
      R2_OUTPUTS_BUCKET: "${R2_OUTPUTS_BUCKET:-}"
      R2_TEMPLATE_PREVIEWS_BUCKET: "${R2_TEMPLATE_PREVIEWS_BUCKET:-}"
      R2_TEMPLATE_PREVIEWS_BASE_URL: "${R2_TEMPLATE_PREVIEWS_BASE_URL:-}"
      PROVIDER_OUTPUT_ALLOWED_HOSTS: "${PROVIDER_OUTPUT_ALLOWED_HOSTS:-}"
      AI_GATEWAY_API_KEY: "${AI_GATEWAY_API_KEY:-}"
      VERCEL_AI_GATEWAY_BASE_URL: "${VERCEL_AI_GATEWAY_BASE_URL:-https://ai-gateway.vercel.sh/v4/ai}"
      VERCEL_GATEWAY_SEEDANCE_RESOLUTION_TIER: "${VERCEL_GATEWAY_SEEDANCE_RESOLUTION_TIER:-720p}"
      VERCEL_GATEWAY_SEEDANCE_GENERATE_AUDIO: "${VERCEL_GATEWAY_SEEDANCE_GENERATE_AUDIO:-false}"
      FFPROBE_PATH: "${FFPROBE_PATH:-ffprobe}"
      FFMPEG_PATH: "${FFMPEG_PATH:-ffmpeg}"
      MOVPROMPT_QUALITY_MODEL_ID: "${MOVPROMPT_QUALITY_MODEL_ID:-google/gemini-3.6-flash}"
      MOVPROMPT_PROVIDER_VERCEL_GATEWAY_READY: "${MOVPROMPT_PROVIDER_VERCEL_GATEWAY_READY:-false}"
      MOVPROMPT_CAPABILITY_VIDEO_CINEMATIC_ENABLED: "${MOVPROMPT_CAPABILITY_VIDEO_CINEMATIC_ENABLED:-false}"
      MOVPROMPT_CAPABILITY_VIDEO_CINEMATIC_ADAPTER_ID: "${MOVPROMPT_CAPABILITY_VIDEO_CINEMATIC_ADAPTER_ID:-}"
      MOVPROMPT_CAPABILITY_VIDEO_CINEMATIC_MODEL_ID: "${MOVPROMPT_CAPABILITY_VIDEO_CINEMATIC_MODEL_ID:-}"
      MOVPROMPT_CAPABILITY_VIDEO_PRODUCT_FIDELITY_ENABLED: "${MOVPROMPT_CAPABILITY_VIDEO_PRODUCT_FIDELITY_ENABLED:-false}"
      MOVPROMPT_CAPABILITY_VIDEO_PRODUCT_FIDELITY_ADAPTER_ID: "${MOVPROMPT_CAPABILITY_VIDEO_PRODUCT_FIDELITY_ADAPTER_ID:-}"
      MOVPROMPT_CAPABILITY_VIDEO_PRODUCT_FIDELITY_MODEL_ID: "${MOVPROMPT_CAPABILITY_VIDEO_PRODUCT_FIDELITY_MODEL_ID:-}"
      MOVPROMPT_CAPABILITY_IMAGE_PRODUCT_ENABLED: "${MOVPROMPT_CAPABILITY_IMAGE_PRODUCT_ENABLED:-false}"
      MOVPROMPT_CAPABILITY_IMAGE_PRODUCT_ADAPTER_ID: "${MOVPROMPT_CAPABILITY_IMAGE_PRODUCT_ADAPTER_ID:-}"
      MOVPROMPT_CAPABILITY_IMAGE_PRODUCT_MODEL_ID: "${MOVPROMPT_CAPABILITY_IMAGE_PRODUCT_MODEL_ID:-}"
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
    stop_grace_period: 40s
    networks:
      - backend

volumes:
  mongodb-data:
  mailpit-data:

networks:
  backend:
    driver: bridge
